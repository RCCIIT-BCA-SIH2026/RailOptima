version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ir_planner_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: railway_password_2026
      POSTGRES_DB: railway_planner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: ir_planner_backend
    environment:
      - DATABASE_URL=postgresql://postgres:railway_password_2026@postgres:5432/railway_planner
      - SECRET_KEY=ir-production-secret-key-2026-sih
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

