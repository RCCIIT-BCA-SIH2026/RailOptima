version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ir_planner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: railway_password_2026
      POSTGRES_DB: railway_planner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d railway_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: ir_planner_ml_service
    restart: unless-stopped
    ports:
      - "8001:8001"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ir_planner_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:railway_password_2026@postgres:5432/railway_planner
      - ML_SERVICE_URL=http://ml-service:8001
      - SECRET_KEY=ir-production-secret-key-2026-sih-ai-block-planner
      - JWT_SECRET=ir-production-secret-key-2026-sih-ai-block-planner
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - PROJECT_NAME="AI-Powered Automatic Block Planning System for Indian Railways"
      - PROJECT_VERSION=1.0.0
      - SIH_PROBLEM_CODE=SIH26027
      - DATA_MODE_LABEL="LIVE ML MICROSERVICE"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ir_planner_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:


