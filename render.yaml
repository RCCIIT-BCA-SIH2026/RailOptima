services:
  - type: web
    name: railoptima-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONPATH
        value: .
